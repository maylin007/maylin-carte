<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Maylin — Sites Web Tahiti</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:#0F1C3F;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;-webkit-font-smoothing:antialiased}
.card{width:100%;max-width:400px;background:linear-gradient(165deg,#0F1C3F 0%,#1A2D5A 100%);border-radius:24px;overflow:hidden;box-shadow:0 40px 80px rgba(0,0,0,.4);position:relative}
.card::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(212,168,83,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(212,168,83,.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none}
.top{padding:40px 32px 24px;text-align:center;position:relative}
.avatar{width:80px;height:80px;border-radius:50%;background:rgba(212,168,83,.12);border:2px solid rgba(212,168,83,.3);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:32px;font-weight:800;color:#D4A853}
.name{font-size:22px;font-weight:800;color:#fff;letter-spacing:.5px}
.role{font-size:12px;font-weight:500;color:rgba(255,255,255,.45);margin-top:4px;letter-spacing:1px;text-transform:uppercase}
.loc{font-size:11px;color:rgba(212,168,83,.7);margin-top:8px;font-weight:600;letter-spacing:.5px}
.actions{padding:0 24px 8px;display:flex;flex-direction:column;gap:8px;position:relative}
.action{display:flex;align-items:center;gap:14px;padding:14px 16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;text-decoration:none;transition:all .2s}
.action:active{transform:scale(.98);background:rgba(212,168,83,.08);border-color:rgba(212,168,83,.2)}
.action-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.action-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:rgba(255,255,255,.4)}
.action-value{font-size:14px;font-weight:600;color:#fff;margin-top:1px}
.a-phone .action-icon{background:rgba(34,197,94,.12);color:#22C55E}
.a-mail .action-icon{background:rgba(59,130,246,.12);color:#3B82F6}
.a-pres .action-icon{background:rgba(212,168,83,.12);color:#D4A853}
.a-save .action-icon{background:rgba(139,92,246,.12);color:#8B5CF6}
.bottom{padding:20px 24px 28px;text-align:center;position:relative}
.qr{width:140px;height:140px;margin:0 auto 12px;background:#fff;border-radius:12px;padding:8px;display:flex;align-items:center;justify-content:center}
.qr img{width:100%;height:100%}
.scan-txt{font-size:10px;color:rgba(255,255,255,.3);letter-spacing:1px;text-transform:uppercase}
.divider{height:1px;background:linear-gradient(90deg,transparent,rgba(212,168,83,.15),transparent);margin:0 24px}
</style>
</head>
<body>
